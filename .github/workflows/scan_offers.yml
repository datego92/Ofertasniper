name: Scan Amazon Offers

on:
  schedule:
    - cron: '0 8,14,20 * * *'   # 08:00, 14:00 y 20:00 UTC todos los días
  workflow_dispatch:              # Ejecución manual desde GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Descarga el historial del run anterior para deduplicación
      - name: Download previous history artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: offers-history
          path: data/
          if_no_artifact_found: warn
          workflow_conclusion: success

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offer scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      # Persiste el historial actualizado como artifact (retención 90 días)
      - name: Upload updated history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offers-history
          path: data/history.json
          retention-days: 90
          if-no-files-found: warn
