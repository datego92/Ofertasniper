name: Scan Amazon Offers

on:
  schedule:
    - cron: '0 * * * *'          # Cada hora
  workflow_dispatch:              # Ejecución manual desde GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set today's date
        run: echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      # Caché de deduplicación diaria (se resetea cada día automáticamente)
      - name: Restore daily dedup cache
        uses: actions/cache@v4
        with:
          path: data/sent_today.json
          key: sent-offers-${{ env.TODAY }}-${{ github.run_id }}
          restore-keys: |
            sent-offers-${{ env.TODAY }}-
            sent-offers-${{ env.TODAY }}

      # Caché de títulos completos (persiste indefinidamente, crece con el tiempo)
      - name: Restore title cache
        uses: actions/cache@v4
        with:
          path: data/title_cache.json
          key: title-cache-${{ github.run_id }}
          restore-keys: |
            title-cache-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offer scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python src/main.py
